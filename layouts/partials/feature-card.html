<a href="{{ .RelPermalink }}" class="feature-card" style="text-decoration:none;color:inherit;">
  <div class="feature-icon">{{ .Params.icon | safeHTML }}</div>
  <div class="feature-title">{{ .Title }}</div>
  <p class="feature-desc">{{ .Description }}</p>
  <span class="blog-card-read" style="margin-top:16px;">Learn more →</span>
</a>
